# Alpine Diskless k3s Cluster Configuration
# Modify these values to match your environment

cluster:
  name: "alpine-k3s"
  k3s_version: "v1.35.0+k3s1"
  token: "" # Leave empty to auto-generate

network:
  domain: "local"
  subnet: "192.168.1.0/24"
  gateway: "192.168.1.254"
  dns_servers:
    - "192.168.1.254"

  # MetalLB LoadBalancer IP range
  loadbalancer_pool:
    start: "192.168.1.70"
    end: "192.168.1.80"

nodes:
  - name: "k3s-21"
    ip: "192.168.1.21"
    role: "master"
    taints:
      - "CriticalAddonsOnly=true:NoExecute"

  - name: "k3s-22"
    ip: "192.168.1.22"
    role: "worker"

  - name: "k3s-23"
    ip: "192.168.1.23"
    role: "worker"

k3s:
  # Services to disable (k3s defaults: servicelb, traefik)
  #disable_services:
  #  - "servicelb"
  #  - "traefik"

  # External datastore for high availability (optional)
  # When enabled, all masters share the same backend database
  #datastore:
  #  type: "postgres"  # postgres, mysql
  #  host: "192.168.1.3"
  #  port: 5432
  #  database: "k3s"
  #  user: "k3s"
  #  password: "CHANGE_ME"
  #  # SSL mode: disable, require, verify-ca, verify-full
  #  sslmode: "disable"

  # Load balancer VIP for worker nodes (recommended for true HA)
  # Workers connect to this VIP which distributes across all masters
  #loadbalancer_vip: "192.168.1.254"

  # Cluster networking
  cluster_cidr: "10.42.0.0/16"
  service_cidr: "10.43.0.0/16"
  flannel_backend: "vxlan"

#services:
#  metallb:
#    enabled: true
#    version: "v0.13.12"
#
#  nginx_ingress:
#    enabled: true
#    version: "v1.8.4"
#    replicas: 2

alpine:
  version: "3.22.1"
  architecture: "aarch64"
  timezone: "America/Denver"

  # Additional packages to install
  packages:
    - "curl"
    - "ca-certificates"
    - "iptables"
    - "ip6tables"
    - "util-linux"
    - "coreutils"
    - "findutils"
    - "netcat-openbsd"
    - "cgroup-tools"
    - "parted"
    - "e2fsprogs"
    - "chrony"  # NTP time synchronization (required for SSL/TLS)

storage:
  # Partition sizes (used by setup-bootable-device.sh for SD card preparation)
  boot_partition_size: "512MiB"

  # Persistent paths for bind mounts (handled by storage-init service)
  persistent_paths:
    - "/etc/k3s"
    - "/var/lib/k3s"

ssh:
  port: 22
  permit_root_login: true
  password_authentication: true

  # SSH public keys (add your keys here)
  authorized_keys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEZLY9AEip1+eIHgAL6yArtOYkQmr628i/1dnQ1f2d7q you@example.com"
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDgWNENolh5s+6d+tpHV8IpnGG3JQr5Ozu6tg2QXIyyB kike@localhost.local"
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDgWNENolh5s+6d+tpHV8IpnGG3JQr5Ozu6tg2QXIyyB kike@localhost.local"

# Overlay packages - packages to include in apkovl for early boot
# Architecture-specific packages will be downloaded automatically
overlay_packages:
  - name: "openssh"
  - name: "chrony"  # NTP time synchronization (required for SSL/TLS)
  - name: "chrony-openrc"  # OpenRC init script for chrony
  - name: "e2fsprogs"
  - name: "e2fsprogs-libs"  # Shared libraries for mkfs.ext4
  - name: "libcom_err"  # Error description library
  - name: "libblkid"  # Block device ID library
  - name: "libuuid"  # UUID library
  - name: "libeconf"  # Config file library (needed by libblkid)
  - name: "libarchive"  # Archive library (needed by mke2fs)
  - name: "musl"  # C library and dynamic loader (ld-musl-aarch64.so.1)
  - name: "util-linux"  # Provides blkid, uuidgen binaries
