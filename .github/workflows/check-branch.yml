name: Check Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch:
    name: Check Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch: $BRANCH_NAME"

          # Allow main, develop, release/*, feature/*, feat/*, fix/*, docs/*, chore/*, cicd/*
          if [[ "$BRANCH_NAME" =~ ^(main|develop|release/[0-9]+\.[0-9]+|feature/.+|feat/.+|fix/.+|docs/.+|chore/.+|cicd[-/].+)$ ]]; then
            echo "Branch name is valid"
            exit 0
          fi

          echo "Branch name should follow one of these patterns:"
          echo "  feature/<description>  or  feat/<description>"
          echo "  fix/<description>"
          echo "  docs/<description>"
          echo "  chore/<description>"
          echo "  cicd/<description>  or  cicd-<description>"
          echo "  release/<major>.<minor>"
          exit 1
