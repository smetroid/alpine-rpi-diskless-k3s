name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -S warning -x scripts/*.sh lib/*.sh

  validate:
    name: Validate YAML Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python and PyYAML
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate k3s.yaml.example
        run: python3 -c "import yaml; yaml.safe_load(open('k3s.yaml.example'))"

      - name: Validate qemu.yaml.example
        run: python3 -c "import yaml; yaml.safe_load(open('qemu.yaml.example'))"

      - name: Validate cluster-config.yaml.example
        run: python3 -c "import yaml; yaml.safe_load(open('cluster-config.yaml.example'))"

  test:
    name: Shell Script Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: |
          find scripts lib -name "*.sh" -exec shfmt -d {} \;

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md Makefile; do
            if [ ! -f "$f" ]; then echo "Missing: $f"; exit 1; fi
          done

  build:
    name: Build Apkovl Archives
    runs-on: ubuntu-latest
    needs: [lint, validate, test, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tar gzip yq

      - name: Build production config
        run: |
          chmod +x scripts/*.sh lib/*.sh
          make build CONFIG=k3s.yaml.example

      - name: Build test config
        run: |
          make build-test

      - name: Verify outputs exist
        run: |
          ls -la builds/*.apkovl.tar.gz || echo "No production archives"
          ls -la builds-qemu/*.apkovl.tar.gz || echo "No test archives"
